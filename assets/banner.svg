<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Animated Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070510">
        <animate attributeName="stop-color" values="#070510;#110926;#051329;#070510" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#0f0c29">
        <animate attributeName="stop-color" values="#0f0c29;#1b0e36;#0b2239;#0f0c29" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#1a0933">
        <animate attributeName="stop-color" values="#1a0933;#09203f;#240b36;#1a0933" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Neon Text & Accent Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe">
        <animate attributeName="stop-color" values="#00f2fe;#ff0844;#b86bff;#00f2fe" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#7f00ff">
        <animate attributeName="stop-color" values="#7f00ff;#00f2fe;#ff0844;#7f00ff" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ff007f">
        <animate attributeName="stop-color" values="#ff007f;#7f00ff;#00f2fe;#ff007f" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Wave Gradients -->
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#7f00ff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0.35" />
    </linearGradient>

    <linearGradient id="wave2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7f00ff" stop-opacity="0.25" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur" />
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="grid" width="45" height="45" patternUnits="userSpaceOnUse">
      <path d="M 45 0 L 0 0 0 45" fill="none" stroke="rgba(0, 242, 254, 0.07)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .title {
      font: 900 68px 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
      letter-spacing: 10px;
      fill: url(#neonGrad);
      filter: url(#glow);
    }
    .subtitle {
      font: 600 18px 'Fira Code', 'Consolas', 'Courier New', monospace;
      letter-spacing: 5px;
      fill: #e2e8f0;
      opacity: 0.9;
    }
    .badge-text {
      font: 700 12px 'Fira Code', 'Consolas', monospace;
      letter-spacing: 2px;
      fill: #00f2fe;
    }
    .wave-path-1 {
      animation: waveMove1 8s ease-in-out infinite alternate;
    }
    .wave-path-2 {
      animation: waveMove2 11s ease-in-out infinite alternate;
    }
    .pulse-ring {
      transform-origin: center;
      animation: pulse 4s ease-in-out infinite;
    }
    @keyframes waveMove1 {
      0% { transform: translateX(0px) translateY(0px); }
      100% { transform: translateX(-80px) translateY(10px); }
    }
    @keyframes waveMove2 {
      0% { transform: translateX(-60px) translateY(8px); }
      100% { transform: translateX(40px) translateY(-6px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.85; }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="18" fill="url(#bgGrad)" />
  <rect width="1200" height="320" rx="18" fill="url(#grid)" />

  <!-- Ambient Neon Orbs -->
  <circle cx="200" cy="80" r="90" fill="#00f2fe" opacity="0.18" filter="url(#softGlow)">
    <animate attributeName="cx" values="200;260;200" dur="7s" repeatCount="indefinite" />
    <animate attributeName="cy" values="80;120;80" dur="7s" repeatCount="indefinite" />
  </circle>
  <circle cx="1000" cy="220" r="110" fill="#ff007f" opacity="0.18" filter="url(#softGlow)">
    <animate attributeName="cx" values="1000;930;1000" dur="8s" repeatCount="indefinite" />
    <animate attributeName="cy" values="220;170;220" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle cx="600" cy="150" r="130" fill="#7f00ff" opacity="0.14" filter="url(#softGlow)">
    <animate attributeName="r" values="110;150;110" dur="6s" repeatCount="indefinite" />
  </circle>

  <!-- Floating Particles -->
  <g fill="#ffffff">
    <circle cx="140" cy="60" r="2" opacity="0.7">
      <animate attributeName="cy" values="60;30;60" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="320" cy="240" r="3" fill="#00f2fe" opacity="0.6">
      <animate attributeName="cy" values="240;200;240" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="880" cy="70" r="2.5" fill="#ff007f" opacity="0.7">
      <animate attributeName="cy" values="70;110;70" dur="4.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="1060" cy="120" r="2" opacity="0.8">
      <animate attributeName="cy" values="120;85;120" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="480" cy="50" r="1.8" fill="#b86bff" opacity="0.7">
      <animate attributeName="cy" values="50;80;50" dur="5.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="740" cy="250" r="2.2" fill="#00f2fe" opacity="0.8">
      <animate attributeName="cy" values="250;215;250" dur="4.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Animated Cyber Waves -->
  <path class="wave-path-1" d="M -100 240 C 200 180, 400 290, 700 230 C 950 180, 1150 270, 1350 210 L 1350 340 L -100 340 Z" fill="url(#wave1)" />
  <path class="wave-path-2" d="M -100 265 C 250 310, 500 200, 800 260 C 1020 300, 1180 220, 1350 255 L 1350 340 L -100 340 Z" fill="url(#wave2)" />

  <!-- Decorative HUD Frame Lines -->
  <path d="M 40 35 L 120 35 M 40 35 L 40 85" stroke="url(#neonGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M 1160 35 L 1080 35 M 1160 35 L 1160 85" stroke="url(#neonGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M 40 285 L 120 285 M 40 285 L 40 235" stroke="url(#neonGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M 1160 285 L 1080 285 M 1160 285 L 1160 235" stroke="url(#neonGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Top Pill Badge -->
  <rect x="475" y="42" width="250" height="28" rx="14" fill="rgba(0, 242, 254, 0.08)" stroke="url(#neonGrad)" stroke-width="1.2" />
  <circle cx="496" cy="56" r="4" fill="#00f2fe">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite" />
  </circle>
  <text x="608" y="60" text-anchor="middle" class="badge-text">SYSTEM.ONLINE // 2026</text>

  <!-- Main Glitch / Neon Title -->
  <text x="600" y="155" text-anchor="middle" class="title">ZODICALL</text>

  <!-- Subtitle -->
  <text x="600" y="200" text-anchor="middle" class="subtitle">&lt; FULL-STACK DEVELOPER &amp; CREATIVE CODER /&gt;</text>

  <!-- Animated Laser Divider -->
  <rect x="350" y="222" width="500" height="3" rx="1.5" fill="url(#neonGrad)">
    <animate attributeName="width" values="260;540;260" dur="5s" repeatCount="indefinite" />
    <animate attributeName="x" values="470;330;470" dur="5s" repeatCount="indefinite" />
  </rect>
</svg>
