<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050508" />
      <stop offset="50%" stop-color="#090910" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>

    <!-- Subtle Ambient Aurora -->
    <radialGradient id="auroraCyan" cx="30%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14">
        <animate attributeName="stop-opacity" values="0.08;0.18;0.08" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#050508" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="auroraViolet" cx="70%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.14">
        <animate attributeName="stop-opacity" values="0.16;0.07;0.16" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#050508" stop-opacity="0" />
    </radialGradient>

    <!-- Animated Metallic / Shimmer Text Gradient -->
    <linearGradient id="textShimmer" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="65%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#ffffff" />
      <animateTransform attributeName="gradientTransform" type="translate" from="-1" to="1" dur="8s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Ultra-thin Border Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.55">
        <animate attributeName="stop-color" values="#38bdf8;#a855f7;#10b981;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.4" />
    </linearGradient>

    <!-- Micro Dot Grid -->
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#ffffff" fill-opacity="0.06" />
    </pattern>
  </defs>

  <style>
    .brand {
      font: 800 54px 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      letter-spacing: 18px;
      fill: url(#textShimmer);
    }
    .sub {
      font: 500 13px 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      letter-spacing: 6px;
      fill: #64748b;
    }
    .status {
      font: 600 10.5px 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      letter-spacing: 3px;
      fill: #94a3b8;
    }
  </style>

  <!-- Base Card -->
  <rect x="1" y="1" width="1198" height="258" rx="16" fill="url(#bg)" stroke="url(#borderGlow)" stroke-width="1.2" />
  <rect x="1" y="1" width="1198" height="258" rx="16" fill="url(#auroraCyan)" />
  <rect x="1" y="1" width="1198" height="258" rx="16" fill="url(#auroraViolet)" />
  <rect x="1" y="1" width="1198" height="258" rx="16" fill="url(#dots)" />

  <!-- Minimal Status Pill -->
  <g transform="translate(525, 42)">
    <rect width="150" height="24" rx="12" fill="#0d0e17" stroke="#1e293b" stroke-width="1" />
    <circle cx="18" cy="12" r="3" fill="#10b981">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <text x="82" y="15.5" text-anchor="middle" class="status">AVAILABLE</text>
  </g>

  <!-- Centerpiece Typography -->
  <text x="609" y="142" text-anchor="middle" class="brand">ZODICALL</text>
  <text x="603" y="182" text-anchor="middle" class="sub">SYSTEMS ARCHITECTURE  //  FULL-STACK  //  AUTOMATION</text>

  <!-- Sleek Animated Horizon Line -->
  <line x1="250" y1="218" x2="950" y2="218" stroke="url(#borderGlow)" stroke-width="1" />
  <circle cx="600" cy="218" r="2" fill="#38bdf8">
    <animate attributeName="cx" values="380;820;380" dur="7s" repeatCount="indefinite" />
    <animate attributeName="fill" values="#38bdf8;#a855f7;#10b981;#38bdf8" dur="7s" repeatCount="indefinite" />
  </circle>
</svg>
