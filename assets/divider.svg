<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 18" width="100%" height="18">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="25%" stop-color="#00f2fe">
        <animate attributeName="stop-color" values="#00f2fe;#ff007f;#7f00ff;#00f2fe" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#ff007f">
        <animate attributeName="stop-color" values="#ff007f;#7f00ff;#00f2fe;#ff007f" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="75%" stop-color="#7f00ff">
        <animate attributeName="stop-color" values="#7f00ff;#00f2fe;#ff007f;#7f00ff" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#7f00ff" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect x="0" y="7" width="1200" height="3" rx="1.5" fill="url(#divGrad)" />
  <circle cx="600" cy="8.5" r="5" fill="#00f2fe">
    <animate attributeName="cx" values="200;1000;200" dur="6s" repeatCount="indefinite" />
    <animate attributeName="fill" values="#00f2fe;#ff007f;#7f00ff;#00f2fe" dur="6s" repeatCount="indefinite" />
  </circle>
</svg>
