<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 280" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0b18" />
      <stop offset="100%" stop-color="#151029" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe">
        <animate attributeName="stop-color" values="#00f2fe;#ff007f;#7f00ff;#00f2fe" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#7f00ff">
        <animate attributeName="stop-color" values="#7f00ff;#00f2fe;#ff007f;#7f00ff" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ff007f">
        <animate attributeName="stop-color" values="#ff007f;#7f00ff;#00f2fe;#ff007f" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <style>
    .mono {
      font: 600 15px 'Fira Code', 'Consolas', 'Courier New', monospace;
    }
    .title-bar {
      font: 700 13px 'Segoe UI', system-ui, sans-serif;
      fill: #94a3b8;
      letter-spacing: 1px;
    }
    .prompt { fill: #00f2fe; }
    .cmd { fill: #f8fafc; }
    .key { fill: #ff007f; }
    .str { fill: #a7f3d0; }
    .arr { fill: #fde047; }
    .comment { fill: #64748b; font-style: italic; }
    .line1 { animation: fadeIn 0.8s ease forwards; }
    .line2 { opacity: 0; animation: fadeIn 0.8s ease 0.5s forwards; }
    .line3 { opacity: 0; animation: fadeIn 0.8s ease 1.0s forwards; }
    .line4 { opacity: 0; animation: fadeIn 0.8s ease 1.5s forwards; }
    .line5 { opacity: 0; animation: fadeIn 0.8s ease 2.0s forwards; }
    .line6 { opacity: 0; animation: fadeIn 0.8s ease 2.5s forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(-8px); }
      to { opacity: 1; transform: translateX(0); }
    }
  </style>

  <!-- Outer Card -->
  <rect x="2" y="2" width="846" height="276" rx="14" fill="url(#termBg)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Top Bar -->
  <path d="M 2 16 Q 2 2 16 2 L 834 2 Q 848 2 848 16 L 848 42 L 2 42 Z" fill="#1a1433" />
  <line x1="2" y1="42" x2="848" y2="42" stroke="url(#borderGrad)" stroke-width="1" stroke-opacity="0.5" />

  <!-- Window Controls -->
  <circle cx="26" cy="22" r="6.5" fill="#ff5f56" />
  <circle cx="48" cy="22" r="6.5" fill="#ffbd2e" />
  <circle cx="70" cy="22" r="6.5" fill="#27c93f" />

  <text x="425" y="27" text-anchor="middle" class="title-bar">zodicall@nexus: ~/workspace</text>

  <!-- Terminal Content -->
  <g class="mono" transform="translate(30, 75)">
    <g class="line1">
      <text x="0" y="0" class="prompt">❯</text>
      <text x="22" y="0" class="cmd">cat profile_manifest.json</text>
    </g>

    <g class="line2">
      <text x="0" y="32" class="cmd">{</text>
      <text x="24" y="60" class="key">"alias"</text><text x="90" y="60" class="cmd">:</text><text x="108" y="60" class="str">"zodicall"</text><text x="200" y="60" class="cmd">,</text>
    </g>

    <g class="line3">
      <text x="24" y="88" class="key">"craft"</text><text x="90" y="88" class="cmd">:</text><text x="108" y="88" class="str">"Full-Stack Web, Real-Time Systems &amp; Automation"</text><text x="550" y="88" class="cmd">,</text>
    </g>

    <g class="line4">
      <text x="24" y="116" class="key">"arsenal"</text><text x="108" y="116" class="cmd">:</text><text x="126" y="116" class="arr">["TypeScript", "Python", "Rust", "C#", "React", "Node.js", "Godot"]</text><text x="735" y="116" class="cmd">,</text>
    </g>

    <g class="line5">
      <text x="24" y="144" class="key">"vibe"</text><text x="80" y="144" class="cmd">:</text><text x="98" y="144" class="str">"Fast code, reactive UIs, zero bloat ⚡"</text>
      <text x="0" y="172" class="cmd">}</text>
    </g>

    <g class="line6">
      <text x="0" y="200" class="prompt">❯</text>
      <text x="22" y="200" class="comment"># Ready to ship next-gen software</text>
      <rect x="332" y="186" width="9" height="17" fill="#00f2fe">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>
</svg>
