<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#09090f" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>

    <linearGradient id="trace" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <pattern id="matrix" width="22" height="14" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="10" height="10" rx="2.5" fill="#12131f" />
    </pattern>
  </defs>

  <style>
    .pulse {
      fill: none;
      stroke: url(#trace);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 220 1400;
      animation: run 6s linear infinite;
    }
    .c1 { fill: #1e293b; animation: fade 3s infinite alternate; }
    .c2 { fill: #38bdf8; animation: fade 2.4s 0.5s infinite alternate; }
    .c3 { fill: #818cf8; animation: fade 3.2s 1.1s infinite alternate; }
    .c4 { fill: #10b981; animation: fade 2.8s 1.7s infinite alternate; }
    @keyframes run {
      0% { stroke-dashoffset: 1620; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes fade {
      0% { opacity: 0.2; }
      100% { opacity: 0.9; }
    }
  </style>

  <rect x="4" y="4" width="1192" height="112" rx="12" fill="url(#bg)" stroke="#1e293b" stroke-width="1" />

  <g transform="translate(28, 22)">
    <rect width="1144" height="70" fill="url(#matrix)" />

    <rect x="46" y="16" width="10" height="10" rx="2.5" class="c2" />
    <rect x="134" y="30" width="10" height="10" rx="2.5" class="c3" />
    <rect x="222" y="16" width="10" height="10" rx="2.5" class="c1" />
    <rect x="310" y="44" width="10" height="10" rx="2.5" class="c4" />
    <rect x="398" y="30" width="10" height="10" rx="2.5" class="c2" />
    <rect x="486" y="16" width="10" height="10" rx="2.5" class="c3" />
    <rect x="574" y="44" width="10" height="10" rx="2.5" class="c2" />
    <rect x="662" y="30" width="10" height="10" rx="2.5" class="c4" />
    <rect x="750" y="16" width="10" height="10" rx="2.5" class="c3" />
    <rect x="838" y="44" width="10" height="10" rx="2.5" class="c2" />
    <rect x="926" y="30" width="10" height="10" rx="2.5" class="c1" />
    <rect x="1014" y="16" width="10" height="10" rx="2.5" class="c4" />
    <rect x="1080" y="44" width="10" height="10" rx="2.5" class="c2" />

    <path class="pulse" d="M 7 7 L 249 7 L 249 49 L 535 49 L 535 21 L 821 21 L 821 63 L 1129 63" />
  </g>
</svg>
