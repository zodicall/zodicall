<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 185" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a10" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>

    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="accent3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <style>
    .title {
      font: 700 17px 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      fill: #f8fafc;
      letter-spacing: 0.4px;
    }
    .desc {
      font: 400 12.5px 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      fill: #94a3b8;
    }
    .meta {
      font: 500 11px 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      fill: #64748b;
      letter-spacing: 0.5px;
    }
    .badge {
      font: 600 10px 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      letter-spacing: 1px;
    }
  </style>

  <!-- CARD 1: mikumikucrawler -->
  <g transform="translate(4, 6)">
    <rect width="382" height="172" rx="12" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
    <!-- Top Animated Laser Accent -->
    <rect x="24" y="0" width="90" height="2" rx="1" fill="url(#accent1)">
      <animate attributeName="width" values="60;140;60" dur="5s" repeatCount="indefinite" />
    </rect>

    <circle cx="354" cy="28" r="3.5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite" />
    </circle>

    <text x="26" y="34" class="title">mikumikucrawler</text>
    <text x="26" y="64" class="desc">Real-time web crawler engine with live</text>
    <text x="26" y="84" class="desc">socket telemetry and reactive UI.</text>

    <line x1="26" y1="122" x2="356" y2="122" stroke="#1e293b" stroke-width="0.8" />
    <circle cx="32" cy="146" r="4" fill="#38bdf8" />
    <text x="44" y="150" class="meta">TypeScript  ·  Puppeteer  ·  Socket.io</text>
  </g>

  <!-- CARD 2: yt-dlp-ui -->
  <g transform="translate(409, 6)">
    <rect width="382" height="172" rx="12" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
    <rect x="24" y="0" width="90" height="2" rx="1" fill="url(#accent2)">
      <animate attributeName="width" values="130;55;130" dur="6s" repeatCount="indefinite" />
    </rect>

    <circle cx="354" cy="28" r="3.5" fill="#c084fc">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite" />
    </circle>

    <text x="26" y="34" class="title">yt-dlp-ui</text>
    <text x="26" y="64" class="desc">Full-stack web interface for high-speed</text>
    <text x="26" y="84" class="desc">media extraction and playlist pipelines.</text>

    <line x1="26" y1="122" x2="356" y2="122" stroke="#1e293b" stroke-width="0.8" />
    <circle cx="32" cy="146" r="4" fill="#c084fc" />
    <text x="44" y="150" class="meta">TypeScript  ·  Python  ·  yt-dlp</text>
  </g>

  <!-- CARD 3: text-spammer -->
  <g transform="translate(814, 6)">
    <rect width="382" height="172" rx="12" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
    <rect x="24" y="0" width="90" height="2" rx="1" fill="url(#accent3)">
      <animate attributeName="width" values="70;150;70" dur="5.5s" repeatCount="indefinite" />
    </rect>

    <circle cx="354" cy="28" r="3.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite" />
    </circle>

    <text x="26" y="34" class="title">text-spammer</text>
    <text x="26" y="64" class="desc">Low-latency desktop input automation</text>
    <text x="26" y="84" class="desc">and configurable dispatch utility.</text>

    <line x1="26" y1="122" x2="356" y2="122" stroke="#1e293b" stroke-width="0.8" />
    <circle cx="32" cy="146" r="4" fill="#10b981" />
    <text x="44" y="150" class="meta">C#  ·  .NET  ·  WinAPI</text>
  </g>
</svg>
